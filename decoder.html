<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Decoder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #F5F0E8;
      --bg-alt:     #EDE8D8;
      --text:       #2C2416;
      --muted:      #8A7B68;
      --accent:     #317F7D;
      --accent-h:   #256462;
      --accent-dim: #E3F0EF;
      --border:     #CEC5B0;
      --sb-w:       52px;
      --sb-open:    192px;
      --fs:         15px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Lora', Georgia, serif;
      font-size: var(--fs);
      display: flex;
    }

    /* ── SIDEBAR ───────────────────────────────────────── */

    #sb {
      width: var(--sb-w);
      min-width: var(--sb-w);
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width 0.22s ease, min-width 0.22s ease;
      overflow: hidden;
      z-index: 20;
      flex-shrink: 0;
    }
    #sb.open { width: var(--sb-open); min-width: var(--sb-open); }

    .sb-head {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 10px;
      flex-shrink: 0;
    }

    .sb-title {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: var(--accent);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.15s;
      letter-spacing: 0.07em;
      flex: 1;
    }
    #sb.open .sb-title { opacity: 1; }

    .sb-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 0;
    }
    .sb-nav::-webkit-scrollbar { display: none; }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 16px;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      min-height: 44px;
    }
    .sb-item:hover  { background: var(--accent-dim); color: var(--accent); }
    .sb-item.active { background: var(--accent-dim); color: var(--accent); }
    .sb-item svg { flex-shrink: 0; width: 18px; height: 18px; }

    .sb-lbl {
      font-size: 12.5px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    #sb.open .sb-lbl { opacity: 1; }

    /* sub-panels */
    .sb-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 10px 14px 13px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .sb-panel.open { display: flex; }
    #sb:not(.open) .sb-panel { display: none !important; }

    .sb-panel label {
      font-size: 11.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sb-panel select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Lora', serif;
      font-size: 12px;
      padding: 5px 7px;
      border-radius: 3px;
      cursor: pointer;
      outline: none;
    }
    .sb-panel select:focus { border-color: var(--accent); }

    .sb-panel input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .exp-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Lora', serif;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .exp-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
    .exp-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ── MAIN ──────────────────────────────────────────── */

    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* ── TOP PANEL ─────────────────────────────────────── */

    #tp {
      height: 35%;
      min-height: 80px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tp-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
      flex-shrink: 0;
      background: var(--bg-alt);
    }
    .tp-bar svg { width: 14px; height: 14px; flex-shrink: 0; }

    #tp-info {
      flex: 1;
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tp-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-family: 'Lora', serif;
      padding: 3px 7px;
      border-radius: 2px;
      white-space: nowrap;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .tp-btn:hover { background: var(--accent-dim); color: var(--accent); }

    #dz {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #dz-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    #dz-hint svg   { width: 26px; height: 26px; color: var(--border); }
    #dz-hint p     { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--muted); }
    #dz-hint span  { font-size: 11px; color: var(--border); }

    #dz.has-content #dz-hint { opacity: 0; }
    #dz.drag-over             { background: var(--accent-dim); }
    #dz.drag-over #dz-hint    { opacity: 1 !important; }
    #dz.drag-over #dz-hint svg { color: var(--accent); }
    #dz.drag-over #dz-hint p   { color: var(--accent); }

    #ta {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      color: var(--text);
      padding: 10px 14px;
      line-height: 1.65;
      z-index: 1;
    }
    #ta::placeholder { color: var(--border); }

    /* ── DIVIDER ───────────────────────────────────────── */

    #dv {
      height: 7px;
      background: var(--border);
      cursor: ns-resize;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      user-select: none;
    }
    #dv:hover, #dv.dragging { background: var(--accent); }
    #dv::after {
      content: '';
      width: 36px;
      height: 2px;
      background: rgba(255,255,255,0.45);
      border-radius: 1px;
    }

    /* ── BOTTOM PANEL ──────────────────────────────────── */

    #bp {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 40px;
      min-height: 0;
    }
    #bp::-webkit-scrollbar       { width: 5px; }
    #bp::-webkit-scrollbar-track { background: transparent; }
    #bp::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .r-empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border);
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      font-style: italic;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    /* ── RESULT: CHAT ──────────────────────────────────── */

    .conv-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent);
    }

    .conv-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    .msg {
      margin-bottom: 18px;
    }

    .msg-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 3px;
    }

    .msg-role {
      font-family: 'Playfair Display', serif;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.11em;
    }

    .msg-time {
      font-family: 'Courier Prime', monospace;
      font-size: 10.5px;
      color: var(--border);
    }

    .msg-body {
      font-family: 'Lora', serif;
      font-size: var(--fs);
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.82;
    }

    /* ── RESULT: GENERIC JSON TREE ─────────────────────── */

    .json-tree {
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
      line-height: 1.7;
    }

    .jk    { color: var(--accent); }
    .js    { color: #7A5C3A; }
    .jn    { color: #5A7A3A; }
    .jb    { color: #7D5A31; font-style: italic; }
    .jnull { color: var(--muted); font-style: italic; }
    .jnode { margin-left: 18px; }

    .jblock { display: inline; }

    .jtoggle {
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      font-size: 9px;
      margin-right: 3px;
      display: inline-block;
      width: 10px;
      vertical-align: middle;
    }
    .jtoggle:hover { color: var(--accent); }

    .jchildren { display: block; }
    .jblock.collapsed > .jchildren { display: none; }

    /* ── TOC ───────────────────────────────────────────── */

    .toc {
      margin-bottom: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .toc-head {
      padding: 9px 14px;
      background: var(--bg-alt);
      font-family: 'Playfair Display', serif;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }

    .toc-list {
      list-style: none;
      max-height: 260px;
      overflow-y: auto;
    }
    .toc-list::-webkit-scrollbar { width: 4px; }
    .toc-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .toc-item a {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      text-decoration: none;
      color: var(--text);
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s, color 0.12s;
    }
    .toc-item:last-child a { border-bottom: none; }
    .toc-item a:hover { background: var(--accent-dim); color: var(--accent); }

    .toc-name {
      font-family: 'Lora', serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .toc-count {
      font-family: 'Courier Prime', monospace;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── PARSE ERROR ───────────────────────────────────── */

    .perr {
      font-family: 'Courier Prime', monospace;
      font-size: 12.5px;
      color: #8B3A3A;
      background: #F9EDEC;
      border: 1px solid #D4A5A0;
      padding: 13px 16px;
      border-radius: 3px;
      line-height: 1.65;
    }

    /* ── TOAST ─────────────────────────────────────────── */

    #toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--text);
      color: var(--bg);
      font-family: 'Lora', serif;
      font-size: 12.5px;
      padding: 7px 16px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #file-input { display: none; }
  </style>
</head>
<body>

<!-- ── SIDEBAR ──────────────────────────────────────────── -->
<aside id="sb">
  <div class="sb-head" id="sb-toggle">
    <span class="sb-title">Decoder</span>
    <span data-lucide="panel-left" style="width:18px;height:18px;color:var(--muted);flex-shrink:0"></span>
  </div>

  <nav class="sb-nav">

    <div class="sb-item" id="btn-up" title="Upload file">
      <span data-lucide="file-up"></span>
      <span class="sb-lbl">Upload file</span>
    </div>

    <div class="sb-item" id="btn-fmt" title="Format">
      <span data-lucide="layers"></span>
      <span class="sb-lbl">Format</span>
    </div>
    <div class="sb-panel" id="pnl-fmt">
      <label>Detect as</label>
      <select id="fmt-sel">
        <option value="auto">Auto detect</option>
        <option value="claude">Claude</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="telegram">Telegram</option>
        <option value="discord">Discord</option>
        <option value="generic">Generic JSON</option>
      </select>
    </div>

    <div class="sb-item" id="btn-fs" title="Font size">
      <span data-lucide="type"></span>
      <span class="sb-lbl">Font size</span>
    </div>
    <div class="sb-panel" id="pnl-fs">
      <label>Size: <b id="fs-val">15</b>px</label>
      <input type="range" id="fs-range" min="12" max="22" value="15" step="1">
    </div>

    <div class="sb-item" id="btn-exp" title="Export">
      <span data-lucide="download"></span>
      <span class="sb-lbl">Export</span>
    </div>
    <div class="sb-panel" id="pnl-exp">
      <button class="exp-btn" id="exp-txt">
        <span data-lucide="file-text"></span> Export .txt
      </button>
      <button class="exp-btn" id="exp-pdf">
        <span data-lucide="file"></span> Export .pdf
      </button>
    </div>

    <div class="sb-item" id="btn-copy" title="Copy all">
      <span data-lucide="copy"></span>
      <span class="sb-lbl">Copy all</span>
    </div>

    <div class="sb-item" id="btn-clr" title="Clear">
      <span data-lucide="trash-2"></span>
      <span class="sb-lbl">Clear</span>
    </div>

  </nav>
</aside>

<!-- ── MAIN ─────────────────────────────────────────────── -->
<main id="main">

  <!-- TOP PANEL -->
  <div id="tp">
    <div class="tp-bar">
      <span data-lucide="braces"></span>
      <span id="tp-info">no file loaded</span>
      <button class="tp-btn" id="tp-up-btn">upload ↑</button>
    </div>
    <div id="dz">
      <div id="dz-hint">
        <span data-lucide="file-json"></span>
        <p>Drop a JSON file here</p>
        <span>or click "upload ↑" · or paste below</span>
      </div>
      <textarea id="ta" spellcheck="false" placeholder="Paste JSON here…"></textarea>
    </div>
  </div>

  <!-- DIVIDER -->
  <div id="dv"></div>

  <!-- BOTTOM PANEL -->
  <div id="bp">
    <div class="r-empty" id="r-empty">— paste or upload JSON to begin —</div>
    <div id="rc" style="display:none"></div>
  </div>

</main>

<input type="file" id="file-input" accept=".json,application/json">
<div id="toast"></div>

<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
lucide.createIcons();

const $ = id => document.getElementById(id);
const sb = $('sb'), dz = $('dz'), ta = $('ta');
const rc = $('rc'), rEmpty = $('r-empty'), tpInfo = $('tp-info');
const fmtSel = $('fmt-sel'), fsRange = $('fs-range'), fsVal = $('fs-val');
const fileInput = $('file-input');

let parsedData = null, rawText = '';

// ── SIDEBAR ──────────────────────────────────────────────

$('sb-toggle').addEventListener('click', () => {
  sb.classList.toggle('open');
  if (!sb.classList.contains('open')) {
    document.querySelectorAll('.sb-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
  }
});

function bindPanel(btnId, panelId) {
  const btn = $(btnId), panel = $(panelId);
  btn.addEventListener('click', e => {
    e.stopPropagation();
    const wasOpen = panel.classList.contains('open');
    document.querySelectorAll('.sb-panel').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.sb-item').forEach(i => i.classList.remove('active'));
    if (!wasOpen) {
      panel.classList.add('open');
      btn.classList.add('active');
      if (!sb.classList.contains('open')) sb.classList.add('open');
    }
  });
}

bindPanel('btn-fmt', 'pnl-fmt');
bindPanel('btn-fs',  'pnl-fs');
bindPanel('btn-exp', 'pnl-exp');

// upload
$('btn-up').addEventListener('click',    () => fileInput.click());
$('tp-up-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) readFile(e.target.files[0]);
  fileInput.value = '';
});

// font size
fsRange.addEventListener('input', () => {
  fsVal.textContent = fsRange.value;
  document.documentElement.style.setProperty('--fs', fsRange.value + 'px');
});

// format change
fmtSel.addEventListener('change', () => { if (rawText.trim()) parse(); });

// copy all
$('btn-copy').addEventListener('click', () => {
  const txt = extractText();
  if (!txt) { showToast('Nothing to copy'); return; }
  navigator.clipboard.writeText(txt).then(() => showToast('Copied to clipboard'));
});

// clear
$('btn-clr').addEventListener('click', reset);

// export txt
$('exp-txt').addEventListener('click', () => {
  const txt = extractText();
  if (!txt) { showToast('Nothing to export'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
  a.download = 'decoded.txt';
  a.click();
  showToast('Saved as .txt');
});

// export pdf
$('exp-pdf').addEventListener('click', () => {
  if (rc.style.display === 'none') { showToast('Nothing to export'); return; }
  const clone = rc.cloneNode(true);
  clone.style.cssText = `
    font-family: 'Lora', Georgia, serif;
    font-size: 13px;
    color: #2C2416;
    background: #F5F0E8;
    padding: 0;
    line-height: 1.8;
  `;
  html2pdf().set({
    margin: [16, 20],
    filename: 'decoded.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, backgroundColor: '#F5F0E8', useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(clone).save().then(() => showToast('Saved as .pdf'));
});

// ── DROPZONE ─────────────────────────────────────────────

dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) readFile(f);
});

function readFile(file) {
  const reader = new FileReader();
  reader.onload = e => load(e.target.result, file.name);
  reader.readAsText(file, 'utf-8');
}

function load(text, filename) {
  rawText = text;
  ta.value = text;
  dz.classList.add('has-content');
  tpInfo.textContent = filename || 'pasted';
  parse();
}

ta.addEventListener('input', () => {
  rawText = ta.value;
  if (rawText.trim()) {
    dz.classList.add('has-content');
    tpInfo.textContent = 'pasted';
    parse();
  } else {
    reset();
  }
});

// ── PARSE & RENDER ────────────────────────────────────────

function parse() {
  try {
    parsedData = JSON.parse(rawText);
    const fmt = fmtSel.value === 'auto' ? detect(parsedData) : fmtSel.value;
    render(parsedData, fmt);
  } catch (e) {
    showResult(`<div class="perr"><strong>JSON Parse Error</strong><br>${esc(e.message)}</div>`);
  }
}

function detect(d) {
  if (Array.isArray(d)) {
    if (d[0]?.chat_messages) return 'claude';
    if (d[0]?.mapping)       return 'chatgpt';
  }
  if (d?.messages) {
    if (d.type  !== undefined) return 'telegram';
    if (d.guild !== undefined) return 'discord';
  }
  return 'generic';
}

function render(d, fmt) {
  let html = '';
  switch (fmt) {
    case 'claude':   html = renderClaude(d);   break;
    case 'chatgpt':  html = renderChatGPT(d);  break;
    case 'telegram': html = renderTelegram(d); break;
    case 'discord':  html = renderDiscord(d);  break;
    default:         html = renderGeneric(d);  break;
  }
  showResult(html);
}

function showResult(html) {
  rEmpty.style.display = 'none';
  rc.style.display = 'block';
  rc.innerHTML = html;
  lucide.createIcons({ nodes: [rc] });
  // bind JSON tree toggles
  rc.querySelectorAll('.jtoggle').forEach(t => {
    t.addEventListener('click', e => {
      e.stopPropagation();
      const blk = t.closest('.jblock');
      if (!blk) return;
      blk.classList.toggle('collapsed');
      t.textContent = blk.classList.contains('collapsed') ? '▶' : '▼';
    });
  });
}

// ── CHAT RENDERERS ────────────────────────────────────────

function msgHTML({ role, text, time }) {
  return `<div class="msg">
    <div class="msg-head">
      <span class="msg-role">${esc(role)}</span>
      ${time ? `<span class="msg-time">${time}</span>` : ''}
    </div>
    <div class="msg-body">${esc(text)}</div>
  </div>`;
}

// TOC builder
function buildTOC(items) {
  if (items.length <= 1) return '';
  const rows = items.map((item, i) =>
    `<li class="toc-item"><a href="#conv-${i}">
      <span class="toc-name">${esc(item.title || '(untitled)')}</span>
      <span class="toc-count">${item.count} msgs</span>
    </a></li>`
  ).join('');
  return `<div class="toc"><div class="toc-head">Conversations — ${items.length}</div><ul class="toc-list">${rows}</ul></div>`;
}

// Claude
function renderClaude(d) {
  const convs = Array.isArray(d) ? d : [d];
  const tocItems = convs.map(conv => ({
    title: conv.name || conv.title || '',
    count: (conv.chat_messages || conv.messages || []).length
  }));
  let html = buildTOC(tocItems);
  convs.forEach((conv, i) => {
    if (i > 0) html += '<hr class="conv-divider">';
    const title = conv.name || conv.title;
    html += `<div class="conv-title" id="conv-${i}">${esc(title || '(untitled)')}</div>`;
    const msgs = conv.chat_messages || conv.messages || [];
    msgs.forEach(m => {
      let text = '';
      if (typeof m.text === 'string')    text = m.text;
      else if (Array.isArray(m.content)) text = m.content.map(c => c.text || '').join('');
      else if (typeof m.content === 'string') text = m.content;
      html += msgHTML({
        role: m.sender || m.role || '?',
        text,
        time: m.created_at ? fmtDate(m.created_at) : ''
      });
    });
  });
  return html;
}

// ChatGPT
function renderChatGPT(d) {
  const convs = Array.isArray(d) ? d : [d];
  const tocItems = convs.map(conv => {
    const count = conv.mapping
      ? Object.values(conv.mapping).filter(n => n.message?.author?.role !== 'system' && n.message?.content?.parts?.join('').trim()).length
      : 0;
    return { title: conv.title || '', count };
  });
  let html = buildTOC(tocItems);
  convs.forEach((conv, i) => {
    if (i > 0) html += '<hr class="conv-divider">';
    html += `<div class="conv-title" id="conv-${i}">${esc(conv.title || '(untitled)')}</div>`;
    if (!conv.mapping) return;

    const nodes = conv.mapping;
    const rootId = Object.keys(nodes).find(id => nodes[id].parent == null);
    if (!rootId) return;

    const visited = new Set();
    const visit = (nodeId) => {
      if (!nodeId || visited.has(nodeId)) return;
      visited.add(nodeId);
      const node = nodes[nodeId];
      if (!node) return;
      const msg = node.message;
      if (msg && msg.author?.role !== 'system' && msg.content?.parts) {
        const text = msg.content.parts.filter(p => typeof p === 'string').join('\n').trim();
        if (text) {
          html += msgHTML({
            role: msg.author.role || '?',
            text,
            time: msg.create_time ? fmtDate(new Date(msg.create_time * 1000).toISOString()) : ''
          });
        }
      }
      (node.children || []).forEach(visit);
    };
    visit(rootId);
  });
  return html;
}

// Telegram
function renderTelegram(d) {
  let html = '';
  if (d.name) html += `<div class="conv-title">${esc(d.name)}</div>`;
  (d.messages || []).filter(m => m.type === 'message').forEach(m => {
    let text = '';
    if (typeof m.text === 'string') text = m.text;
    else if (Array.isArray(m.text)) text = m.text.map(t => typeof t === 'string' ? t : (t.text || '')).join('');
    html += msgHTML({
      role: m.from || m.actor || '?',
      text,
      time: m.date ? fmtDate(m.date) : ''
    });
  });
  return html;
}

// Discord
function renderDiscord(d) {
  let html = '';
  const ch = d.channel?.name || d.channel?.category || '';
  if (ch) html += `<div class="conv-title">#${esc(ch)}</div>`;
  (d.messages || []).forEach(m => {
    html += msgHTML({
      role: m.author?.nickname || m.author?.name || '?',
      text: m.content || '',
      time: m.timestamp ? fmtDate(m.timestamp) : ''
    });
  });
  return html;
}

// Generic JSON tree
function renderGeneric(d) {
  return `<div class="json-tree">${jTree(d)}</div>`;
}

function jTree(v) {
  if (v === null)                  return `<span class="jnull">null</span>`;
  if (v === true || v === false)   return `<span class="jb">${v}</span>`;
  if (typeof v === 'number')       return `<span class="jn">${v}</span>`;
  if (typeof v === 'string')       return `<span class="js">"${esc(v)}"</span>`;

  if (Array.isArray(v)) {
    if (!v.length) return `<span>[]</span>`;
    const items = v.map((x, i) =>
      `<div class="jnode">${jTree(x)}${i < v.length - 1 ? ',' : ''}</div>`
    ).join('');
    return `<span class="jblock"><span class="jtoggle">▼</span><span>[</span><div class="jchildren">${items}</div><span>]</span></span>`;
  }

  if (typeof v === 'object') {
    const keys = Object.keys(v);
    if (!keys.length) return `<span>{}</span>`;
    const items = keys.map((k, i) =>
      `<div class="jnode"><span class="jk">"${esc(k)}"</span>: ${jTree(v[k])}${i < keys.length - 1 ? ',' : ''}</div>`
    ).join('');
    return `<span class="jblock"><span class="jtoggle">▼</span><span>{</span><div class="jchildren">${items}</div><span>}</span></span>`;
  }

  return esc(String(v));
}

// ── UTILS ─────────────────────────────────────────────────

function extractText() {
  if (!parsedData) return '';
  const fmt = fmtSel.value === 'auto' ? detect(parsedData) : fmtSel.value;
  if (fmt === 'generic') return JSON.stringify(parsedData, null, 2);
  return rc.innerText || '';
}

function reset() {
  parsedData = null;
  rawText = '';
  ta.value = '';
  dz.classList.remove('has-content');
  tpInfo.textContent = 'no file loaded';
  rEmpty.style.display = 'flex';
  rc.style.display = 'none';
  rc.innerHTML = '';
}

function fmtDate(s) {
  try {
    const d = new Date(s);
    if (isNaN(d)) return String(s);
    return d.toLocaleString('sv-SE', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  } catch { return String(s); }
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2300);
}

// ── DRAGGABLE DIVIDER ─────────────────────────────────────

const dv = $('dv'), tp = $('tp');
let dragging = false, dragY0, dragH0;

function startDrag(y) {
  dragging = true;
  dragY0 = y;
  dragH0 = tp.getBoundingClientRect().height;
  dv.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'ns-resize';
}

function moveDrag(y) {
  if (!dragging) return;
  const mainH = $('main').getBoundingClientRect().height;
  const h = Math.max(60, Math.min(mainH - 80, dragH0 + (y - dragY0)));
  tp.style.height = h + 'px';
  tp.style.flex = 'none';
}

function endDrag() {
  if (!dragging) return;
  dragging = false;
  dv.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
}

dv.addEventListener('mousedown', e => { e.preventDefault(); startDrag(e.clientY); });
document.addEventListener('mousemove', e => moveDrag(e.clientY));
document.addEventListener('mouseup', endDrag);

dv.addEventListener('touchstart', e => startDrag(e.touches[0].clientY), { passive: true });
document.addEventListener('touchmove', e => {
  if (dragging) { e.preventDefault(); moveDrag(e.touches[0].clientY); }
}, { passive: false });
document.addEventListener('touchend', endDrag);
</script>
